# Docker Compose configuration for 7Red card game application
# This file defines the multi-container setup for the backend and frontend services

services:
  backend:
    # Using pre-built Docker image from Docker Hub
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped 
    environment:
      PROJECT_ID: ${PROJECT_ID}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      BRANCH_ID: ${BRANCH_ID}
      DATABASE_URL: ${DATABASE_URL}
      WS_URL: ${WS_URL}
      SERVER_PW: ${SERVER_PW}

  frontend:
    # Using pre-built Docker image from Docker Hub
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        WS_URL: ${WS_URL}
    container_name: frontend
    ports:
      # Map host port 8080 to container port 80 (default)
      - "8080:80"
    # Ensure backend starts before frontend to avoid connection issues
    depends_on:
      - backend
    restart: unless-stopped
