name: CI/CD Pipeline

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Run tests
        run: |
          cd tests
          pytest -v tests.py


  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Copy docker-compose.yml to VPS
        run: |
          scp -o StrictHostKeyChecking=no ./docker-compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:/root/app/   
      
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
            mkdir -p /deploy/database
            
            cat > /deploy/docker-compose.yml << 'COMPOSE'
            version: "3.9"
            services:
              backend:
                image: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
                ports:
                  - "8000:8000"
                env_file:
                  - ./database/.env
                restart: unless-stopped

              frontend:
                image: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
                ports:
                  - "8080:80"
                depends_on:
                  - backend
                restart: unless-stopped
            COMPOSE

            cat > /deploy/database/.env << 'ENV'
            PROJECT_ID=small-frog-40177030
            DB_USER=neondb_owner
            DB_PASS=npg_gCvztMWnb3G7
            BRANCH_ID=br-falling-paper-a8xmzet9
            DATABASE_URL=postgresql+asyncpg://neondb_owner:npg_gCvztMWnb3G7@ep-rapid-water-a86zpa0x-pooler.eastus2.azure.neon.tech/red7_db?sslmode=require
            ENV

            chmod 600 /deploy/database/.env
            chown -R root:root /deploy

            cd /deploy
            docker-compose down
            docker-compose up -d
          EOF