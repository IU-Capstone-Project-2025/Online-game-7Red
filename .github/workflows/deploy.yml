name: CI/CD Pipeline

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Run tests
        run: |
          cd tests
          pytest -v tests.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          platforms: linux/amd64
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Prepare server environment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'PREPARE_EOF'
            # Cleanup previous deployment
            docker-compose -f /deploy/docker-compose.yml down || true
            docker system prune -a -f || true
            
            # Create directory structure
            mkdir -p /deploy/database
          PREPARE_EOF
      
      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << DEPLOY_EOF
            # Login to Docker Hub
            echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
            
            # Create docker-compose.yml with resource limits
            cat > /deploy/docker-compose.yml << COMPOSE_EOF
            version: "3.9"
            services:
              backend:
                image: $DOCKER_HUB_REPO:$BACKEND_TAG
                ports:
                  - "8000:8000"
                env_file:
                  - ./database/.env
                restart: unless-stopped
                deploy:
                  resources:
                    limits:
                      memory: 300M
                      cpus: '0.5'

              frontend:
                image: $DOCKER_HUB_REPO:$FRONTEND_TAG
                ports:
                  - "8080:80"
                depends_on:
                  - backend
                restart: unless-stopped
                deploy:
                  resources:
                    limits:
                      memory: 200M
                      cpus: '0.3'
            COMPOSE_EOF

            # Create .env file
            cat > /deploy/database/.env << ENV_EOF
            PROJECT_ID=$PROJECT_ID
            DB_USER=$DB_USER
            DB_PASS=$DB_PASS
            BRANCH_ID=$BRANCH_ID
            DATABASE_URL=$DATABASE_URL
            ENV_EOF

            # Set permissions
            chmod 600 /deploy/database/.env
            chown -R root:root /deploy

            # Pull images and deploy
            cd /deploy
            docker-compose pull
            docker-compose up -d
            
            # Verify deployment
            sleep 10
            docker-compose ps
            docker-compose logs --tail=50
          DEPLOY_EOF
        env:
          DOCKER_HUB_REPO: ${{ env.DOCKER_HUB_REPO }}
          BACKEND_TAG: ${{ env.BACKEND_TAG }}
          FRONTEND_TAG: ${{ env.FRONTEND_TAG }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          BRANCH_ID: ${{ secrets.BRANCH_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Final verification
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'VERIFY_EOF'
            echo "=== Running containers ==="
            docker ps -a
            echo "\n=== Resource usage ==="
            docker stats --no-stream
            echo "\n=== Ports listening ==="
            netstat -tulnp | grep -E '8000|8080' || true
          VERIFY_EOF