name: CI/CD Pipeline

on:
  push:
    branches: [ cicd ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  
  build-and-push:
    #needs: frontend_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Debug - List files
        run: |
          echo "Содержимое репозитория:"
          ls -R
          echo "Проверка Dockerfile:"
          ls -l backend/Dockerfile || echo "Dockerfile не найден!"   
           
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:backend-latest
          platforms: linux/amd64
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:frontend-latest
          platforms: linux/amd64
      - name: Verify images were pushed
        run: |
          docker pull ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          docker pull ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Debug - Check SSH connection
        run: |
          echo "Проверяем подключение к серверу..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "echo 'SSH подключение успешно!'"

      - name: Prepare server environment
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            set -x   
            docker-compose -f ~/deploy/docker-compose.yml down || true
            docker network rm deploy_default || true
            docker system prune -a -f || true
          EOF
      - name: Copy docker-compose.yml
        run: |
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ./docker-compose.yml \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/deploy/docker-compose.yml
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            
            cd ~/deploy 

            docker-compose -f docker-compose.yml down || true
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d
          EOF
      
      
