name: CI/CD Pipeline

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Run tests
        run: |
          cd tests
          pytest -v tests.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Create deploy directory
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} \
            "mkdir -p /deploy/database"
      
      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'DEPLOY_EOF'
            # Create docker-compose.yml
            cat > /deploy/docker-compose.yml << 'COMPOSE_EOF'
            version: "3.9"
            services:
              backend:
                image: $DOCKER_IMAGE_BACKEND
                ports:
                  - "8000:8000"
                env_file:
                  - ./database/.env
                restart: unless-stopped

              frontend:
                image: $DOCKER_IMAGE_FRONTEND
                ports:
                  - "8080:80"
                depends_on:
                  - backend
                restart: unless-stopped
            COMPOSE_EOF

            # Create .env file
            cat > /deploy/database/.env << 'ENV_EOF'
            PROJECT_ID=$PROJECT_ID
            DB_USER=$DB_USER
            DB_PASS=$DB_PASS
            BRANCH_ID=$BRANCH_ID
            DATABASE_URL=$DATABASE_URL
            ENV_EOF

            # Set permissions
            chmod 600 /deploy/database/.env
            chown -R root:root /deploy

            # Deploy containers
            cd /deploy
            docker-compose down || true
            docker-compose pull
            docker-compose up -d
          DEPLOY_EOF
        env:
          DOCKER_IMAGE_BACKEND: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          DOCKER_IMAGE_FRONTEND: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          BRANCH_ID: ${{ secrets.BRANCH_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'VERIFY_EOF'
            echo "=== Directory structure ==="
            ls -la /deploy
            echo "\n=== Database files ==="
            ls -la /deploy/database
            echo "\n=== Running containers ==="
            docker ps
            echo "\n=== Docker images ==="
            docker images
          VERIFY_EOF