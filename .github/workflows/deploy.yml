# CI/CD Pipeline for 7Red game application
# Triggers on pushes to 'main' branch and runs tests, builds Docker images, and deploys to VPS
name: CI/CD Pipeline

on:
  push:
    branches: [ refact ]

# Global environment variables used across all jobs
env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red  # Docker Hub repository name
  BACKEND_TAG: backend-${{ github.sha }}    # Unique tag for backend image using commit SHA
  FRONTEND_TAG: frontend-${{ github.sha }}  # Unique tag for frontend image using commit SHA

jobs:
  # Job 3: Build Docker images and push to Docker Hub - only runs if all tests pass
  build-and-push: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Login to Docker Hub using stored credentials
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Build and push backend Docker image with multiple tags
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:backend-latest
          platforms: linux/amd64
          
      # Build and push frontend Docker image with multiple tags
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          build-args: |
            WS_URL=wss://7red.ru/api
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:frontend-latest
          platforms: linux/amd64       
          
      # Verify that images were successfully pushed to Docker Hub
      - name: Verify images were pushed
        run: |
          docker pull ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          docker pull ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}

  # Job 4: Deploy to VPS server - only runs if Docker images are successfully built and pushed
  deploy:
    needs: build-and-push  # This job depends on successful completion of build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Install SSH private key for secure connection to VPS
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}      # Private SSH key stored in GitHub secrets
          known_hosts: ${{ secrets.KNOWN_HOSTS }}  # Known hosts file for security

      # Test SSH connection to ensure server is reachable
      - name: Debug - Check SSH connection
        run: |
          echo "Проверяем подключение к серверу..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "echo 'SSH подключение успешно!'"

      # Clean up previous deployment and Docker resources on server
      - name: Prepare server environment
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            set -x   
            docker-compose -f ~/deploy/docker-compose.yml down || true
            docker network rm deploy_default || true
            docker system prune -a -f || true
          EOF
          
      # Copy docker-compose.yml file to the VPS server
      - name: Copy docker-compose.yml
        run: |
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ./docker-compose.yml \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/deploy/docker-compose.yml
              
      # Deploy the application using docker-compose on the VPS
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            
            cd ~/deploy 

            docker-compose -f docker-compose.yml down || true  # Stop existing containers
            docker-compose -f docker-compose.yml pull          # Pull latest images
            docker-compose -f docker-compose.yml up -d         # Start containers in detached mode
          EOF
      
      
