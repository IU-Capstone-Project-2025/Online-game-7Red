name: CI/CD Pipeline

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Run tests
        run: |
          cd tests
          pytest -v tests.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          platforms: linux/amd64
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Debug - Check SSH connection
        run: |
          echo "Проверяем подключение к серверу..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "echo 'SSH подключение успешно!'"

      - name: Prepare server environment
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            set -x  
            mkdir -p ~/deploy/database 
            docker-compose -f ~/deploy/docker-compose.yml down || true
            docker system prune -a -f || true
          EOF
      - name: Copy docker-compose.yml
        run: |
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ./docker-compose.yml \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/deploy/docker-compose.yml
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << EOF
            cd ~/deploy
            
            if [ ! -f .env ]; then
              echo "Ошибка: .env файл не найден в папке ~/deploy!"
              exit 1
            fi
            
            docker-compose down || true
            docker-compose pull
            docker-compose up -d
          EOF
      
      