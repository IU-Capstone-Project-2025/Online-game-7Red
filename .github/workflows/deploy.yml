name: CI/CD Pipeline

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Run tests
        run: |
          cd tests
          pytest -v tests.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          platforms: linux/amd64
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Prepare server environment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'PREPARE_EOF'
            # Cleanup previous deployment
            docker-compose -f /deploy/docker-compose.yml down || true
            docker system prune -a -f || true
            
            # Create directory structure
            mkdir -p /deploy/database
          PREPARE_EOF
      
            - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'COMPOSE_EOF'
            set -e

            echo "✅ Подключение прошло успешно"

            # Создаем директорию проекта
            mkdir -p ~/project && cd ~/project

            # Скачиваем docker-compose.yml из GitHub
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/deploy/docker-compose.yml

            # Скачиваем .env файл (если он нужен и доступен — ИЛИ создаём здесь вручную)
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

            # Обновляем образы и запускаем контейнеры
            docker-compose pull
            docker-compose up -d
          COMPOSE_EOF

      - name: Verify Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'VERIFY_EOF'
            echo "=== Running containers ==="
            docker ps

            echo "=== Resource usage ==="
            docker stats --no-stream

            echo "=== Ports listening ==="
            ss -tuln || echo "⚠️ ss команда не найдена"
          VERIFY_EOF
