name: CI/CD Pipeline

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/7red
  BACKEND_TAG: backend-${{ github.sha }}
  FRONTEND_TAG: frontend-${{ github.sha }}

jobs:
  backend_test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      BRANCH_ID=: ${{ secrets.BRANCH_ID }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Unit and Api tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE
          cd tests
          pytest -v test_unit.py
          pytest -v test_api_integration.py

  frontend_test:
    needs: backend_test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      BRANCH_ID=: ${{ secrets.BRANCH_ID }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'  
          channel: 'stable'
      - name: Navigate to Flutter project
        run: cd frontend

      - name: Install dependencies
        run: |
          flutter pub get
      
      - name: Run Flutter widget tests
        run: |
          flutter test test/widget_test.dart

  build-and-push:
    needs: frontend_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:backend-latest
          platforms: linux/amd64
          
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:frontend-latest
          platforms: linux/amd64
      - name: Verify images were pushed
        run: |
          docker pull ${{ env.DOCKER_HUB_REPO }}:${{ env.BACKEND_TAG }}
          docker pull ${{ env.DOCKER_HUB_REPO }}:${{ env.FRONTEND_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Debug - Check SSH connection
        run: |
          echo "Проверяем подключение к серверу..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "echo 'SSH подключение успешно!'"

      - name: Prepare server environment
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            set -x   
            docker-compose -f ~/deploy/docker-compose.yml down || true
            docker network rm deploy_default || true
            docker system prune -a -f || true
          EOF
      - name: Copy docker-compose.yml
        run: |
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ./docker-compose.yml \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/deploy/docker-compose.yml
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
            
            cd ~/deploy 

            docker-compose -f docker-compose.yml down || true
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d
          EOF
      
      
