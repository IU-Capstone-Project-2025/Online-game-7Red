name: Deploy to VPS

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build and Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:latest -f backend/Dockerfile .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:latest

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/my-frontend:latest -f frontend/Dockerfile .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my-frontend:latest

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'COMPOSE_EOF'
          rm -rf ~/myapp || true
          mkdir ~/myapp
          cd ~/myapp

          # Копируем docker-compose.yml и .env
          cat > docker-compose.yml << 'EOF'
          version: '3'
          services:
            backend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/my-backend:latest
              ports:
                - "8000:8000"
              environment:
                - DATABASE_URL=${{ secrets.DATABASE_URL }}

            frontend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/my-frontend:latest
              ports:
                - "80:80"
          EOF

          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          PROJECT_ID=${{ secrets.PROJECT_ID }}
          EOF

          docker compose pull
          docker compose up -d
          COMPOSE_EOF

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'VERIFY_EOF'
          echo "=== Running containers ==="
          docker ps

          echo "\n=== Resource usage ==="
          docker stats --no-stream

          echo "\n=== Ports listening ==="
          ss -tuln
          VERIFY_EOF
